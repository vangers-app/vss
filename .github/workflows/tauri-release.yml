name: Tauri Release

on:
  push:
    branches: [wip-js-runtime-alpha, vss]
    tags: ['v*']
  pull_request:
    branches: [wip-js-runtime-alpha, vss]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixed into the frontend bundle by app/vite.config.ts; unset in fork pull
  # requests, where the in-app download reports the missing URL.
  GAME_DATA_URL: ${{ vars.GAME_DATA_URL }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bundles: appimage
            artifact-glob: app/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            artifact-ext: AppImage
          - target: windows-x86_64
            runs-on: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact-glob: app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            artifact-ext: exe
          # macos-x86_64 temporarily disabled (macos-13 Intel runner availability)
          # - target: macos-x86_64
          #   runs-on: macos-13
          #   rust-target: x86_64-apple-darwin
          #   bundles: dmg
          #   artifact-glob: app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          #   artifact-ext: dmg
          - target: macos-aarch64
            runs-on: macos-14
            rust-target: aarch64-apple-darwin
            bundles: dmg
            artifact-glob: app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact-ext: dmg

    steps:
      - name: Rewrite SSH submodule URLs to HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            ninja-build \
            file

      - name: Install Ninja (Windows/macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache-${{ matrix.target }}

      - name: Setup CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }},wasm32-unknown-emscripten

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Build vangers (WebAssembly)
        shell: bash
        run: |
          emsdk_dir="$EMSDK"
          if command -v cygpath >/dev/null 2>&1; then
            emsdk_dir="$(cygpath -u "$EMSDK")"
          fi
          source "$emsdk_dir/emsdk_env.sh"
          # Invoke cmake with the Emscripten toolchain directly instead of the
          # `emcmake` wrapper, which on Windows only ships as emcmake.bat and is
          # not resolvable from git-bash. Use forward-slash form so native cmake
          # accepts the path on every platform.
          toolchain="${EMSDK//\\//}/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          mkdir -p emscripten
          cd emscripten
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DCMAKE_BUILD_TYPE=MinSizeRel ..
          ninja vangers

      - name: Install frontend dependencies
        shell: bash
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Build Tauri release
        shell: bash
        working-directory: app
        run: yarn tauri build --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}

      - name: Collect & rename artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist-artifacts
          shopt -s nullglob
          files=( ${{ matrix.artifact-glob }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No artifacts matched ${{ matrix.artifact-glob }}"
            exit 1
          fi
          ref_name="${GITHUB_REF_NAME//\//-}"
          for f in "${files[@]}"; do
            base="Vangers-${ref_name}-${{ matrix.target }}.${{ matrix.artifact-ext }}"
            cp "$f" "dist-artifacts/${base}"
            echo "Collected: dist-artifacts/${base}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vangers-${{ matrix.target }}
          path: dist-artifacts/*
          if-no-files-found: error

  ios:
    name: Build (ios-aarch64)
    # Intel runner: macOS arm64 runners are frequently unavailable ("not acquired
    # by Runner of type hosted"); Xcode cross-builds the arm64 iOS app regardless.
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      # `tauri ios init` asks for a development team even though the archive is
      # built with code signing disabled; any value satisfies it.
      APPLE_DEVELOPMENT_TEAM: XXXXXXXXXX

    steps:
      - name: Rewrite SSH submodule URLs to HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache-ios-aarch64

      - name: Setup CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,wasm32-unknown-emscripten

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ios-aarch64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Build vangers (WebAssembly)
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          mkdir -p emscripten
          cd emscripten
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel ..
          ninja vangers

      - name: Install frontend dependencies
        shell: bash
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Generate Xcode project
        shell: bash
        working-directory: app
        run: yarn tauri ios init --ci

      - name: Build unsigned iOS IPA
        shell: bash
        working-directory: app
        run: yarn tauri ios build --ci --no-sign

      - name: Collect & rename artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist-artifacts
          shopt -s nullglob
          files=( app/src-tauri/gen/apple/build/arm64/*.ipa )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No IPA found under app/src-tauri/gen/apple/build/arm64"
            exit 1
          fi
          ref_name="${GITHUB_REF_NAME//\//-}"
          cp "${files[0]}" "dist-artifacts/Vangers-${ref_name}-ios-aarch64.ipa"
          echo "Collected: dist-artifacts/Vangers-${ref_name}-ios-aarch64.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vangers-ios-aarch64
          path: dist-artifacts/*
          if-no-files-found: error

  android:
    name: Build (android-aarch64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Rewrite SSH submodule URLs to HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 platform-tools

      - name: Export NDK_HOME
        shell: bash
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache-android-aarch64

      - name: Setup CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-emscripten

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android-aarch64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Build vangers (WebAssembly)
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          mkdir -p emscripten
          cd emscripten
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel ..
          ninja vangers

      - name: Install frontend dependencies
        shell: bash
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Android build is unsigned: ANDROID_KEYSTORE_BASE64 is not set"
            exit 0
          fi
          keystore="$RUNNER_TEMP/vandroid.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          cat > app/src-tauri/gen/android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Signing with keystore $keystore"

      - name: Build Android AAB and APK
        shell: bash
        working-directory: app
        run: |
          # Must stay above the last versionCode uploaded to Google Play (1027).
          version_code=$(( 1100 + ${{ github.run_number }} ))
          echo "versionCode=$version_code"
          yarn tauri android build --aab --apk --target aarch64 --ci \
            --config "{\"bundle\":{\"android\":{\"versionCode\":$version_code}}}"

      - name: Collect & rename artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist-artifacts
          shopt -s nullglob
          outputs=app/src-tauri/gen/android/app/build/outputs
          aabs=( "$outputs"/bundle/*/*.aab )
          apks=( "$outputs"/apk/universal/release/*.apk )
          if [ ${#aabs[@]} -eq 0 ] || [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No AAB/APK found under $outputs"
            find "$outputs" -name '*.aab' -o -name '*.apk'
            exit 1
          fi
          ref_name="${GITHUB_REF_NAME//\//-}"
          cp "${aabs[0]}" "dist-artifacts/Vangers-${ref_name}-android-aarch64.aab"
          cp "${apks[0]}" "dist-artifacts/Vangers-${ref_name}-android-aarch64.apk"
          ls -la dist-artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vangers-android-aarch64
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, ios, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -la dist-artifacts/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
