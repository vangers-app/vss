[package]
name = "app"
version = "0.1.0"
description = "Vangers: Soup Supervisor — a video game that combines elements of the racing and role-playing genres."
authors = ["Alexander Guryanov <caiiiycuk@gmail.com>", "KranX Productions"]
homepage = "https://github.com/caiiiycuk/vss"
repository = "https://github.com/caiiiycuk/vss"
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"

